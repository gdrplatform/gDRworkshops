name: Test workshop reports

on:
  push:
    branches: [main, GDR-*]
  pull_request:
    branches: [main]
  # A template change in gDR does not trigger this workflow, so without a schedule the copies
  # here drift unnoticed until somebody next pushes.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      full_datasets:
        description: Also render the four full datasets (ubuntu only, up to 360 minutes each)
        type: boolean
        default: false

# Each example renders in a job of its own, so it gets a runner of its own: its own memory, its
# own time limit, and its own pass/fail in the checks list. The steps live in
# render-workshop-example.yaml; the lists below say what each job renders.
#
# Fields of an example:
#   reports:  rendered in order, separated by single spaces
#   script:   sourced instead of rendering reports
#   expect:   a file the render must have produced
#   outputs:  uploaded as the artefact, one path per line
#   timeout:  job limit in minutes
jobs:
  test-workshops:
    name: ${{ matrix.example.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        example:
          - name: SmallDrugCombo subset
            dir: examples/subsets/SmallDrugCombo
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd
            artifact: subset-smalldrugcombo-reports
            timeout: 60
            outputs: |
              examples/subsets/SmallDrugCombo/*.html
              examples/subsets/SmallDrugCombo/gDR_data/
              examples/subsets/SmallDrugCombo/plots/
              examples/subsets/SmallDrugCombo/tables/
          - name: PRISMBroadScreen subset
            dir: examples/subsets/PRISMBroadScreen
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd 3-1-PRISM_analysis.Rmd
            artifact: subset-prismbroadscreen-reports
            timeout: 60
            outputs: |
              examples/subsets/PRISMBroadScreen/*.html
              examples/subsets/PRISMBroadScreen/gDR_data/
              examples/subsets/PRISMBroadScreen/plots/
              examples/subsets/PRISMBroadScreen/tables/
          - name: LargeDrugCombo subset
            dir: examples/subsets/LargeDrugCombo
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd
            artifact: subset-largedrugcombo-reports
            timeout: 60
            outputs: |
              examples/subsets/LargeDrugCombo/*.html
              examples/subsets/LargeDrugCombo/gDR_data/
              examples/subsets/LargeDrugCombo/plots/
              examples/subsets/LargeDrugCombo/tables/
          - name: ChemicalGenomics subset
            dir: examples/subsets/ChemicalGenomics
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd
            artifact: subset-chemicalgenomics-reports
            timeout: 60
            outputs: |
              examples/subsets/ChemicalGenomics/*.html
              examples/subsets/ChemicalGenomics/gDR_data/
              examples/subsets/ChemicalGenomics/plots/
              examples/subsets/ChemicalGenomics/tables/
          # runs gDR's own Incucyte templates, so this also covers run_report()
          - name: Timecourse_HMSLINCS_MCF10A_2016
            dir: examples/Timecourse_HMSLINCS_MCF10A_2016
            script: render_report.R
            expect: report/v1/plots/cell_count_curves_20160421_MCF10A.pdf
            artifact: timecourse-report-v1
            timeout: 60
            outputs: examples/Timecourse_HMSLINCS_MCF10A_2016/report/v1/
    uses: ./.github/workflows/render-workshop-example.yaml
    with:
      os: ${{ matrix.os }}
      example: ${{ toJSON(matrix.example) }}

  # The full datasets have never run on a hosted runner and may not fit, so they stay out of the
  # PR and weekly runs and are rendered on request only. They get the 360-minute ceiling of
  # GitHub-hosted runners rather than a guess of ours, so a timeout means they do not fit at all.
  test-full-datasets:
    name: ${{ matrix.example.name }} (ubuntu-latest)
    if: github.event_name == 'workflow_dispatch' && inputs.full_datasets
    strategy:
      fail-fast: false
      matrix:
        example:
          - name: SmallDrugCombo_Zhou_CellChemBio_2026
            dir: examples/SmallDrugCombo_Zhou_CellChemBio_2026
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd
            artifact: smalldrugcombo-zhou-reports
            timeout: 360
            outputs: |
              examples/SmallDrugCombo_Zhou_CellChemBio_2026/*.html
              examples/SmallDrugCombo_Zhou_CellChemBio_2026/gDR_data/
              examples/SmallDrugCombo_Zhou_CellChemBio_2026/plots/
              examples/SmallDrugCombo_Zhou_CellChemBio_2026/tables/
          - name: PRISMBroadScreen_Hagenbeek_NatComm_2026
            dir: examples/PRISMBroadScreen_Hagenbeek_NatComm_2026
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd 3-1-PRISM_analysis.Rmd
            artifact: prismbroadscreen-hagenbeek-reports
            timeout: 360
            outputs: |
              examples/PRISMBroadScreen_Hagenbeek_NatComm_2026/*.html
              examples/PRISMBroadScreen_Hagenbeek_NatComm_2026/gDR_data/
              examples/PRISMBroadScreen_Hagenbeek_NatComm_2026/plots/
              examples/PRISMBroadScreen_Hagenbeek_NatComm_2026/tables/
          - name: ChemicalGenomics_Hagenbeek_NatCancer_2023
            dir: examples/ChemicalGenomics_Hagenbeek_NatCancer_2023
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd 3-1-chemical_genomics_analysis.Rmd
            artifact: chemicalgenomics-hagenbeek-reports
            timeout: 360
            outputs: |
              examples/ChemicalGenomics_Hagenbeek_NatCancer_2023/*.html
              examples/ChemicalGenomics_Hagenbeek_NatCancer_2023/gDR_data/
              examples/ChemicalGenomics_Hagenbeek_NatCancer_2023/plots/
              examples/ChemicalGenomics_Hagenbeek_NatCancer_2023/tables/
          - name: LargeDrugCombo_Goetz_Cancers_2024
            dir: examples/LargeDrugCombo_Goetz_Cancers_2024
            reports: 1-data_import.Rmd 2-processing_and_QC.Rmd 3-analysis.Rmd
            artifact: largedrugcombo-goetz-reports
            timeout: 360
            outputs: |
              examples/LargeDrugCombo_Goetz_Cancers_2024/*.html
              examples/LargeDrugCombo_Goetz_Cancers_2024/gDR_data/
              examples/LargeDrugCombo_Goetz_Cancers_2024/plots/
              examples/LargeDrugCombo_Goetz_Cancers_2024/tables/
    uses: ./.github/workflows/render-workshop-example.yaml
    with:
      os: ubuntu-latest
      example: ${{ toJSON(matrix.example) }}
