<style>
  /* Hide default Apache header */
  h1 { display: none; }

  /* Style the listing area */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  pre { padding: 8px 16px; }
  a[href="HEADER.html"], a[href=".htaccess"] { display: none; }
</style>

<div style="margin: 12px 0; padding: 16px 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 20px;">
  <img src="/projects/gDR/gdr_logo.png" alt="gDR" style="height: 48px;">
  <div style="flex: 1;">
    <div style="font-size: 16px; font-weight: 600; color: #2c3e50;">
      Index of <span id="idx-path" style="font-weight: 400; color: #555;"></span>
    </div>
    <div style="font-size: 12px; color: #888; font-family: monospace; margin-top: 4px;">
      <strong>Scoop:</strong> <span id="scoop-path"></span>
    </div>
  </div>
  <a id="parent-link" href=".." style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: #f0f0f0; border-radius: 6px; color: #555; text-decoration: none; font-size: 13px; white-space: nowrap;">
    &#8592; Parent Directory
  </a>
</div>

<script>
  var path = window.location.pathname;
  document.getElementById("idx-path").textContent = path;
  document.getElementById("scoop-path").textContent = "/gne/web/dev/apache/htdocs" + path;

  // Hide if we're at the gDR root
  if (path === "/projects/gDR/" || path === "/projects/gDR") {
    document.getElementById("parent-link").style.display = "none";
  }
</script>
