# Analysis parameters for the HMS LINCS MCF10A time-course example.
# Read by step 3 of the gDR Incucyte report.

plot_date: "20160421"

cell_lines: ["MCF10A"]

# Hours since treatment. prepare_inputs.R rebases the instrument clock, which
# counts from plating, onto the first image after dosing, and cuts every plate at
# 72 h, the last time point all six share.
# 12-h windows centred on 24 h and 48 h, as in Niepel et al. 2019. Images come every
# 4 h, so each window holds three of them (20-28 h and 44-52 h).
early_period:
- 18
- 30

# (OPTIONAL) add a mid_period to get three phases instead of two

late_period:
- 42
- 54

# Labels the plots show for the phases, named by the hour each window is centred on;
# the tables keep early/late
period_labels:
  early: "24h"
  late: "48h"

# --- PER-PHASE NORMALIZATION MAP ---
# "None"  = raw growth rate (log2/day)
# "early" = normalize by the "early" phase DMSO rate
# "mid"   = normalize by the "mid" phase DMSO rate
# "late"  = normalize by the "late" phase DMSO rate
normalization_map:
  early: "early"
  late: "late"
# -----------------------------------

# "GR" = GR value, 2^(rate / rate_0) - 1; "NormalizedGrowthRate" (default) = rate / rate_0
growth_metric: "GR"

# "free_y" = each phase gets its own y-axis; "fixed" = one shared scale
y_axis_scaling: "free_y"

# --- TREATMENT COMPARISONS ---
# One page of the output PDF per entry. Labels must match the `treatment` column
# built by add_treatment_column(): "<DrugName> <concentration>uM", with the
# concentration rounded to four decimals. Combinations join the arms with " + ",
# e.g. ["DMSO", "DrugA 1uM", "DrugB 0.5uM", "DrugA 1uM + DrugB 0.5uM"] - this
# dataset is single-agent only, so none appear below.
#
# One page per drug: DMSO and every tested concentration, lowest first.
treatment_comparisons:
- ["DMSO", "Neratinib 0.0004uM", "Neratinib 0.0013uM", "Neratinib 0.0033uM", "Neratinib 0.01uM", "Neratinib 0.0316uM", "Neratinib 0.1uM", "Neratinib 0.3162uM", "Neratinib 1uM", "Neratinib 3.1623uM"]
- ["DMSO", "Alpelisib 0.0033uM", "Alpelisib 0.01uM", "Alpelisib 0.0317uM", "Alpelisib 0.1uM", "Alpelisib 0.3162uM", "Alpelisib 1uM", "Alpelisib 3.1623uM", "Alpelisib 10uM"]
- ["DMSO", "Trametinib 0.0002uM", "Trametinib 0.0003uM", "Trametinib 0.001uM", "Trametinib 0.003uM", "Trametinib 0.01uM", "Trametinib 0.0316uM", "Trametinib 0.1uM", "Trametinib 0.3162uM"]
- ["DMSO", "Dasatinib 0.0011uM", "Dasatinib 0.0033uM", "Dasatinib 0.01uM", "Dasatinib 0.0317uM", "Dasatinib 0.1uM", "Dasatinib 0.3162uM", "Dasatinib 1uM", "Dasatinib 3.1623uM", "Dasatinib 10uM"]
- ["DMSO", "Palbociclib 0.0011uM", "Palbociclib 0.0033uM", "Palbociclib 0.01uM", "Palbociclib 0.0317uM", "Palbociclib 0.1uM", "Palbociclib 0.3162uM", "Palbociclib 1uM", "Palbociclib 3.1623uM", "Palbociclib 10uM"]
- ["DMSO", "Paclitaxel 0uM", "Paclitaxel 0.0001uM", "Paclitaxel 0.0003uM", "Paclitaxel 0.001uM", "Paclitaxel 0.0032uM", "Paclitaxel 0.01uM", "Paclitaxel 0.0316uM", "Paclitaxel 0.1uM", "Paclitaxel 0.3162uM"]
- ["DMSO", "Etoposide 0.0033uM", "Etoposide 0.01uM", "Etoposide 0.0317uM", "Etoposide 0.1uM", "Etoposide 0.3162uM", "Etoposide 1uM", "Etoposide 3.1623uM", "Etoposide 10uM"]
- ["DMSO", "Vorinostat 0.01uM", "Vorinostat 0.0317uM", "Vorinostat 0.1uM", "Vorinostat 0.3162uM", "Vorinostat 1uM", "Vorinostat 3.1623uM", "Vorinostat 10uM"]

# Applied in order to each comparison. DMSO in neutral gray, doses of one drug on a
# blue ramp light to dark (up to nine doses).
all_colors: ['#6e6e6c', '#7fb5ff', '#61a0f4', '#4d8cde', '#3a78c8', '#2664b3', '#0e519e', '#003f83', '#002f65', '#001f48']
# For different drugs or combinations on one page, use distinct hues instead:
# all_colors: ['black', 'darkviolet', '#990000', '#55aa00', '#000066', 'blue', 'red', 'green', 'gray']
